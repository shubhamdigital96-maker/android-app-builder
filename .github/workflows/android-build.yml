name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Run lint & unit tests
        # optional but recommended: run lint and unit tests before building
        run: ./gradlew --no-daemon --stacktrace --info :app:lintDebug :app:testDebugUnitTest
        working-directory: android
        continue-on-error: false

      - name: Build Debug + Release + AAB
        run: ./gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug :app:assembleRelease :app:bundleRelease
        working-directory: android

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reports
          path: |
            android/build/reports/**
            android/app/build/reports/**
          retention-days: 7
          - name: Verify gradlew
  run: |
    pwd
    sha256sum gradlew
    tail -20 gradlew
