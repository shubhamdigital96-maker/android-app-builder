name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Project Structure
        run: |
          echo "Current Directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Wrapper:"
          ls -la gradle/wrapper

          echo ""
          echo "gradlew:"
          file gradlew

          echo ""
          echo "wrapper jar:"
          file gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "jar contents:"
          unzip -l gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain || true

          echo ""
          echo "Last 20 lines of gradlew:"
          tail -20 gradlew

      - name: Show Java Version
        run: java -version

      - name: Show Gradle Version
        run: ./gradlew --version

      - name: List Gradle Tasks
        run: ./gradlew tasks --stacktrace --info

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --info --console=plain

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --info --console=plain

      - name: Build Release Bundle
        run: ./gradlew :app:bundleRelease --stacktrace --info --console=plain

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reports
          path: |
            build/reports/**
            app/build/reports/**
          retention-days: 7
